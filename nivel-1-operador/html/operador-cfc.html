                <article class="op-card op-detail"><div class="op-card-heading"><div><p class="op-eyebrow">FICHA DO ALUNO</p><h2>Detalhes e acompanhamento</h2></div><span class="op-badge">Nenhum aluno selecionado</span></div><dl class="op-fields"><div><dt>Nome completo</dt><dd>—</dd></div><div><dt>CPF</dt><dd>—</dd></div><div><dt>Contato</dt><dd>—</dd></div><div><dt>Unidade vinculada</dt><dd>—</dd></div><div><dt>Categoria pretendida</dt><dd>—</dd></div><div><dt>Situação do acesso</dt><dd>Não consultada</dd></div></dl><p class="op-help">Os dados serão exibidos após selecionar um aluno autorizado desta unidade.</p></article>
            </section>

            <section data-op-panel="agenda" aria-label="Agenda da Unidade" hidden><article class="op-card"><h2>Agenda aguardando habilitação</h2><p class="op-help">Depende das permissões e do vínculo com a unidade confirmados no servidor.</p></article></section>

            <section data-op-panel="verificacoes" aria-label="Verificações financeiras, prova e exames" hidden>
                <article class="op-card op-student-selector"><div><h2>Acompanhamento das verificações</h2><p>Selecione um aluno da unidade antes de iniciar uma consulta.</p></div><button class="op-button op-button-outline" type="button" data-op-go="alunos">Consultar alunos <svg aria-hidden="true"><use href="#op-arrow"/></svg></button></article>
                <div class="op-verifications"><article class="op-card"><span class="op-icon op-icon-amber"><svg aria-hidden="true"><use href="#op-check"/></svg></span><h2>Situação financeira · ICFC</h2><span class="op-badge">Integração pendente</span><p>Consulte se o aluno está em dia com suas obrigações financeiras antes de prosseguir com o atendimento.</p><dl class="op-fields"><div><dt>Situação</dt><dd>Não consultada</dd></div><div><dt>Última consulta</dt><dd>—</dd></div></dl><button class="op-button op-button-outline" type="button" disabled aria-describedby="icfc-pendente">Realizar primeira consulta</button><p id="icfc-pendente" class="op-help">O serviço ICFC ainda não está disponível. Nenhuma verificação financeira foi realizada.</p></article>
                    <article class="op-card"><span class="op-icon"><svg aria-hidden="true"><use href="#op-file"/></svg></span><h2>Prova teórica</h2><span class="op-badge">Informação pendente</span><p>Acompanhe a aprovação do aluno na prova teórica e a data de confirmação do resultado.</p><dl class="op-fields"><div><dt>Resultado</dt><dd>Não informado</dd></div><div><dt>Data da prova</dt><dd>—</dd></div></dl><button class="op-button op-button-outline" type="button" disabled>Consultar resultado</button><p class="op-help">A consulta do resultado ainda não está habilitada.</p></article>
                    <article class="op-card"><span class="op-icon op-icon-purple"><svg aria-hidden="true"><use href="#op-file"/></svg></span><h2>Exames médicos necessários</h2><span class="op-badge">Informação pendente</span><p>Confira os exames exigidos para a categoria pretendida e suas respectivas aprovações.</p><dl class="op-fields"><div><dt>Exame médico</dt><dd>Não informado</dd></div><div><dt>Avaliação psicológica</dt><dd>Não informada</dd></div></dl><button class="op-button op-button-outline" type="button" disabled>Consultar exames</button><p class="op-help">Nenhum exame foi consultado ou marcado como aprovado.</p></article></div>
            </section>

            <section data-op-panel="acessos" aria-label="Gestão de acessos" hidden>
                <div class="op-access-grid"><article class="op-card"><div class="op-card-heading"><div><p class="op-eyebrow">LIBERAÇÃO DE ACESSO</p><h2>Um acesso para cada pessoa</h2></div><span class="op-icon op-icon-purple"><svg aria-hidden="true"><use href="#op-key"/></svg></span></div><p class="op-copy">A criação de acesso estará disponível somente para os tipos de usuário autorizados ao seu perfil.</p><fieldset disabled class="op-form-fields" aria-describedby="acesso-pendente"><label>Tipo de usuário<select><option>Selecione um tipo autorizado</option><option>Aluno</option><option>Instrutor</option><option>Demais usuários autorizados</option></select></label><label>CPF do usuário<input type="text" placeholder="000.000.000-00" inputmode="numeric"></label><label>Unidade<input type="text" value="Aguardando vínculo autorizado" readonly></label></fieldset><button class="op-button op-button-primary" type="button" disabled aria-describedby="acesso-pendente">Gerar link de acesso</button><p id="acesso-pendente" class="op-help">A criação de acessos ainda não está habilitada. Nenhum link ou senha foi gerado.</p></article>
                    <article class="op-card"><h2>Como será o primeiro acesso</h2><ol class="op-steps"><li><span>01</span><div><strong>Identificação pelo CPF</strong><p>O CPF será o login padrão do usuário autorizado.</p></div></li><li><span>02</span><div><strong>Link e senha provisória</strong><p>A emissão depende da confirmação do cadastro e das permissões.</p></div></li><li><span>03</span><div><strong>Troca obrigatória de senha</strong><p>O usuário deverá definir sua senha no primeiro acesso.</p></div></li></ol><div class="op-inline-note"><svg aria-hidden="true"><use href="#op-lock"/></svg><p>O vínculo com a unidade e as permissões devem ser confirmados antes de liberar qualquer acesso.</p></div></article></div>
                <article class="op-card op-detail"><div class="op-card-heading"><div><h2>Permissões do operador</h2><p>Aguardando as permissões concedidas à sua conta.</p></div><span class="op-badge">Não identificadas</span></div><p class="op-help">Nenhum tipo de usuário foi autorizado automaticamente para criação de acesso.</p></article>
            </section>

            <section data-op-panel="recursos" aria-label="Recursos vinculados à unidade" hidden>
                <article class="op-card"><div class="op-card-heading"><div><h2>Recursos da sua unidade</h2><p>Consulte somente os vínculos autorizados para o seu atendimento.</p></div><span class="op-unit-chip"><svg aria-hidden="true"><use href="#op-building"/></svg>Unidade não identificada</span></div>
                    <div class="op-resource-tabs" role="tablist" aria-label="Tipos de recurso"><button type="button" role="tab" aria-selected="true" aria-controls="op-resource-panel" id="recurso-todos" data-op-resource="Todos">Todos</button><button type="button" role="tab" aria-selected="false" aria-controls="op-resource-panel" id="recurso-veiculos" tabindex="-1" data-op-resource="Veículos">Veículos</button><button type="button" role="tab" aria-selected="false" aria-controls="op-resource-panel" id="recurso-instrutores" tabindex="-1" data-op-resource="Instrutores">Instrutores</button><button type="button" role="tab" aria-selected="false" aria-controls="op-resource-panel" id="recurso-equipamentos" tabindex="-1" data-op-resource="Equipamentos">Equipamentos</button></div>
                    <div class="op-empty" id="op-resource-panel" role="tabpanel" aria-labelledby="recurso-todos" tabindex="0"><span class="op-icon op-icon-large"><svg aria-hidden="true"><use href="#op-building"/></svg></span><h3 data-op-resource-heading>Recursos aguardando consulta</h3><p>A listagem depende da identificação da sua unidade e da confirmação dos vínculos. Nenhum recurso foi carregado.</p></div>
                </article>
            </section>
            <section data-op-panel="cadastro" aria-label="Cadastrar aluno" hidden></section>
            <section data-op-panel="instrutores" aria-label="Instrutores" hidden></section>
            <section data-op-panel="perfil" aria-label="Meu perfil" hidden></section>
            <footer class="op-footer"><span>AgIA · Atendimento da unidade</span><span>Operador de CFC — nível 1</span></footer>
        </main>

        <dialog class="op-dialog" data-op-dialog aria-labelledby="cadastro-titulo" aria-describedby="cadastro-pendente">
            <div class="op-dialog-heading"><div><p class="op-eyebrow">ATENDIMENTO DA UNIDADE</p><h2 id="cadastro-titulo">Cadastro de aluno</h2></div><button type="button" class="op-close" data-op-fechar aria-label="Fechar cadastro">×</button></div>
            <p id="cadastro-pendente" class="op-inline-note">O cadastro pelo operador ainda não está habilitado. Nenhuma informação será enviada ou armazenada.</p>
            <form><fieldset disabled class="op-form-fields op-form-grid"><label class="op-wide">Nome completo<input name="nome" autocomplete="off" placeholder="Nome completo do aluno"></label><label>CPF · login padrão<input name="cpf" inputmode="numeric" placeholder="000.000.000-00"></label><label>Telefone<input name="telefone" type="tel" placeholder="(00) 00000-0000"></label><label class="op-wide">E-mail<input name="email" type="email" placeholder="E-mail para contato"></label><label>Categoria pretendida<select name="categoria"><option>Selecione</option><option>A · Moto</option><option>B · Carro</option><option>AB · Moto e carro</option></select></label><label>Unidade vinculada<input name="unidade" value="Aguardando vínculo autorizado" readonly></label></fieldset><div class="op-dialog-actions"><button class="op-button op-button-outline" type="button" data-op-fechar>Fechar</button><button class="op-button op-button-primary" type="submit" disabled>Salvar cadastro</button></div></form>
        </dialog>
    </template>
