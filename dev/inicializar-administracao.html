<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPA — Configuração administrativa</title><link rel="stylesheet" href="../css/login.css"><style>body{margin:0;background:#edf4fa;color:#16324f;font:14px Inter,Arial,sans-serif}main{max-width:680px;margin:32px auto;padding:24px;background:#fff;border:1px solid #cbddec;border-radius:12px}fieldset{border:1px solid #cbddec;border-radius:8px;margin:16px 0;padding:16px}label{display:grid;gap:6px;margin:12px 0}input{padding:10px;border:1px solid #cbddec;border-radius:7px;font:inherit}label:has([type=checkbox]){display:flex;align-items:center}button{padding:12px 18px;background:#1769aa;color:#fff;border:0;border-radius:8px;cursor:pointer}p{line-height:1.6}@media(max-width:700px){main{margin:12px}}</style></head><body><main><h1>Configuração administrativa</h1><p>Crie as primeiras contas de Gerência e Acesso Master. Esta configuração só pode ser concluída uma vez pela conta inicial da Recepção autenticada neste navegador.</p><form id="inicializar-administracao"><label>Confirme a senha da Recepção<input type="password" name="senhaRecepcao" required autocomplete="current-password"></label><fieldset><legend>Gerência</legend><label>Nome completo<input name="gerenciaNome" required maxlength="120"></label><label>CPF<input name="gerenciaCpf" required inputmode="numeric" maxlength="14"></label><label>Senha provisória individual<input name="gerenciaSenha" type="password" required minlength="4" maxlength="128" autocomplete="new-password"></label></fieldset><fieldset><legend>Acesso Master</legend><label>Nome completo<input name="masterNome" required maxlength="120"></label><label>CPF<input name="masterCpf" required inputmode="numeric" maxlength="14"></label><label>Senha provisória individual<input name="masterSenha" type="password" required minlength="4" maxlength="128" autocomplete="new-password"></label></fieldset><label><input type="checkbox" name="confirmado" required>Confirmo a criação destas duas contas, com troca de senha obrigatória no primeiro acesso.</label><p id="retorno" role="status"></p><button type="submit">Concluir configuração única</button></form><p><a href="../login.html">Voltar ao login</a></p></main><script type="module" src="./inicializar-administracao.js"></script></body></html>
